apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-joblister-front
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: joblister-front
            port:
              number: 80
      - path: /v1
        pathType: Prefix
        backend:
          service:
            name: joblister-api
            port:
              number: 8080
