apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-jobbed-front
  annotations:
    # Above the client's analyze timeout (170 s, src/api/endpoints/analyses.js)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # Largest body is a CV (100k characters, about 400 kB worst case)
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jobbed-front
            port:
              number: 80
      - path: /v1
        pathType: Prefix
        backend:
          service:
            name: jobbed-api
            port:
              number: 8080
