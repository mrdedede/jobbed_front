apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobbed-front
spec:
  replicas: 1
  selector:
    matchLabels: {app: jobbed-front}
  template:
    metadata:
      labels: {app: jobbed-front}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101  # nginx in nginx-unprivileged
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: front
          # Built locally and loaded into minikube (see README); a fixed tag,
          # not :latest, so a stale image is not picked up by accident.
          image: jobbed-front:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}  # pid file and nginx temp dirs
          # Ready only when the app itself is served; alive while nginx answers.
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 16Mi}

---
apiVersion: v1
kind: Service
metadata:
  name: jobbed-front
spec:
  selector: {app: jobbed-front}
  ports:
  - port: 80
    targetPort: 8080
