apiVersion: apps/v1
kind: Deployment
metadata:
  name: joblister-front
spec:
  replicas: 1
  selector:
    matchLabels: {app: joblister-front}
  template:
    metadata:
      labels: {app: joblister-front}
    spec:
      containers:
        - name: front
          image: joblister-front:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: joblister-front
spec:
  selector: {app: joblister-front}
  ports:
  - port: 80
