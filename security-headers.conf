# Included in every location of nginx.conf: a location with its own
# add_header drops the ones set at server level.
#
# CSP: scripts and API calls stay same-origin. Styles need 'unsafe-inline'
# (Mantine injects <style> and style attributes). blob:/data: images are the
# CV photo; the PDF print frame is srcdoc and inherits this policy.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
